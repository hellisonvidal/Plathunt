apply plugin: 'com.android.application'

// Número do build do GitHub Actions (BUILD_NUMBER); 1 em builds locais.
def buildNumber = (System.getenv("BUILD_NUMBER") ?: "1") as Integer

android {
    namespace = "app.plathunt.trophytracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.plathunt.trophytracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 10000 + build (VERSION_CODE do GitHub Actions): sempre acima dos APKs antigos.
        versionCode((System.getenv("VERSION_CODE") ?: String.valueOf(buildNumber)) as Integer)
        versionName "1.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Duas versões do mesmo app:
    // - github: o APK das Releases, que se atualiza por dentro do app.
    // - play: o pacote (AAB) da Play Store, que se atualiza pela loja.
    flavorDimensions = ["distribuicao"]
    productFlavors {
        github {
            dimension "distribuicao"
        }
        play {
            dimension "distribuicao"
        }
    }
    // Chave de debug versionada no repositório: é PÚBLICA, então só serve para
    // builds de teste. Os APKs publicados (GitHub) e o AAB (Play Store) saem em
    // release, assinados com a chave secreta (ANDROID_KEYSTORE_*): com a chave
    // pública, qualquer pessoa conseguiria criar uma falsa "atualização" que o
    // Android instalaria por cima do app, com acesso ao login da PSN.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Chave secreta do app (a mesma de envio da Play Store): vem dos
        // segredos do GitHub Actions (ANDROID_KEYSTORE_*), nunca do repositório.
        // Sem eles, os builds de release saem sem assinatura.
        if (System.getenv("ANDROID_KEYSTORE_FILE")) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (signingConfigs.findByName("release")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.browser:browser:1.9.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Versão da Play Store: aviso de atualização (In-App Updates do Google Play).
    playImplementation "com.google.android.play:app-update:2.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

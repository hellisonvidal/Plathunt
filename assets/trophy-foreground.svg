<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Troféu de platina. Fica dentro da zona segura (66dp) do ícone adaptativo. -->
  <defs>
    <linearGradient id="plat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d9f0fb"/>
      <stop offset="0.65" stop-color="#a8d8f0"/>
      <stop offset="1" stop-color="#6b9fbd"/>
    </linearGradient>
    <linearGradient id="platDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc9e2"/>
      <stop offset="1" stop-color="#5a87a3"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- alças -->
  <path d="M36 32h-6a8 8 0 0 0 0 16h5" fill="none" stroke="url(#platDark)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M72 32h6a8 8 0 0 1 0 16h-5" fill="none" stroke="url(#platDark)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- taça -->
  <path d="M35 27h38v13c0 11-8.5 19.5-19 19.5S35 51 35 40Z" fill="url(#plat)"/>
  <path d="M35 27h38v13c0 11-8.5 19.5-19 19.5S35 51 35 40Z" fill="url(#shine)"/>
  <rect x="34" y="25" width="40" height="4" rx="2" fill="#eaf7ff"/>
  <!-- estrela -->
  <path d="M54 32.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8Z" fill="#0b2a4a" opacity="0.55"/>
  <!-- haste e base -->
  <path d="M50 59h8v8h-8Z" fill="url(#platDark)"/>
  <path d="M44 67h20a3 3 0 0 1 3 3v3H41v-3a3 3 0 0 1 3-3Z" fill="url(#plat)"/>
  <rect x="38" y="73" width="32" height="7" rx="2" fill="url(#platDark)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Troféu de platina no estilo dos troféus da PSN. Fica na zona segura (66dp) do ícone adaptativo. -->
  <defs>
    <linearGradient id="plat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f9cb8"/>
      <stop offset="0.18" stop-color="#dfeaf5"/>
      <stop offset="0.38" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c6d8ea"/>
      <stop offset="0.8" stop-color="#8eaac6"/>
      <stop offset="1" stop-color="#5d7a98"/>
    </linearGradient>
    <linearGradient id="platV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb8d1"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7d98b3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#9fd4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fd4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="54" cy="50" r="30" fill="url(#glow)"/>
  <!-- alças -->
  <path d="M36.5 31.5c-7.5-.6-11 3.4-10.4 8.3.7 5.6 6 9.4 12.6 10.6" fill="none" stroke="url(#plat)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M71.5 31.5c7.5-.6 11 3.4 10.4 8.3-.7 5.6-6 9.4-12.6 10.6" fill="none" stroke="url(#plat)" stroke-width="3.6" stroke-linecap="round"/>
  <!-- taça -->
  <path d="M35 27.5h38c0 0 .6 6.8-.6 12.6C70.3 50.6 63.6 58 54 58S37.7 50.6 35.6 40.1C34.4 34.3 35 27.5 35 27.5Z" fill="url(#plat)"/>
  <path d="M35 27.5h38c0 0 .6 6.8-.6 12.6C70.3 50.6 63.6 58 54 58S37.7 50.6 35.6 40.1C34.4 34.3 35 27.5 35 27.5Z" fill="url(#platV)"/>
  <ellipse cx="54" cy="27.6" rx="19.2" ry="2.6" fill="url(#rim)"/>
  <ellipse cx="54" cy="27.6" rx="16.5" ry="1.4" fill="#5d7a98" opacity="0.55"/>
  <!-- haste -->
  <path d="M50.6 57.4h6.8l-1.2 7.8h-4.4Z" fill="url(#plat)"/>
  <ellipse cx="54" cy="65.4" rx="5.6" ry="1.6" fill="url(#rim)"/>
  <!-- base em dois níveis -->
  <path d="M44.5 67h19l1.6 6.2H42.9Z" fill="url(#plat)"/>
  <rect x="39.5" y="73" width="29" height="7.5" rx="1.6" fill="url(#plat)"/>
  <rect x="39.5" y="73" width="29" height="2.2" rx="1" fill="#ffffff" opacity="0.45"/>
</svg>

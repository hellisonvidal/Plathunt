name: Android APK

# Gera o APK do app Android. Rode manualmente em Actions → Android APK → Run workflow,
# informando o endereço do servidor publicado (ou defina a variável de repositório
# PERSEUS_SERVER_URL em Settings → Secrets and variables → Actions → Variables).
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Endereço do servidor (ex.: https://perseus.onrender.com)"
        required: false
  push:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "mobile/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Sincronizar projeto Android
        env:
          CAP_SERVER_URL: ${{ inputs.server_url || vars.PERSEUS_SERVER_URL }}
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then
            echo "::warning::Sem endereço do servidor: o APK abrirá uma tela pedindo configuração."
          fi
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: perseus-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Android APK

# Gera o APK do Plathunt (versão do GitHub) e o AAB da Play Store. Roda sozinho a cada mudança no app e
# também manualmente em Actions → Android APK → Run workflow.
# - Em qualquer branch: o APK fica em "Artifacts" (plathunt-android).
# - Na main: também publica uma Release "build-N" com o APK, que é o que o botão
#   "Verificar atualizações" do app consulta.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Número do build: conta as versões publicadas desde a 1.1.1, então a
      # primeira é o build 1; é o que aparece em Configurações.
      # versionCode do Android = 10000 + build: sempre maior que o dos APKs
      # antigos (até 147), então a versão nova instala por cima. A Release usa
      # a tag "build-<versionCode>", formato que o "Verificar atualizações" de
      # todas as versões do app entende.
      - name: Número do build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '[.[] | select(.tagName | test("^(v[0-9.]+-build-[0-9]+|build-1[0-9]{4})$"))] | length')
          echo "BUILD_NUMBER=$((n + 1))" >> "$GITHUB_ENV"
          echo "VITE_BUILD_NUMBER=$((n + 1))" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((10000 + n + 1))" >> "$GITHUB_ENV"
          echo "VITE_VERSION_CODE=$((10000 + n + 1))" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(node -p "require('./mobile/package.json').version")" >> "$GITHUB_ENV"

      # Endereço do servidor dos recursos online (Cloudflare Worker), gravado no
      # app. Vem da variável PLATHUNT_API_URL ou, com os segredos da Cloudflare,
      # do subdomínio workers.dev da conta. Sem nenhum dos dois, o app sai com
      # os recursos online indisponíveis (o resto funciona normalmente).
      - name: Endereço do servidor
        env:
          API_URL: ${{ vars.PLATHUNT_API_URL }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url="$API_URL"
          if [ -z "$url" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            if [ -n "$sub" ]; then url="https://plathunt-api.$sub.workers.dev"; fi
          fi
          if [ -z "$url" ]; then
            echo "::warning::Sem o endereço do servidor (docs/cloudflare.md): os recursos online ficam indisponíveis neste build."
          fi
          echo "VITE_CLOUD_URL=$url" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix mobile

      - name: Testar e compilar o app
        run: |
          npm test --prefix mobile
          npm run build --prefix mobile

      - name: Sincronizar projeto Android
        run: npx cap sync android

      # Chave secreta do app (segredos do repositório, ver docs/play-store.md).
      # Com ela, o APK do GitHub e o AAB da Play Store saem em release, assinados.
      # Sem ela, o APK sai assinado com a chave de testes, que é pública (inseguro:
      # qualquer um poderia publicar uma falsa atualização), e o AAB sem assinatura.
      - name: Preparar chave do app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
            echo "APK_TASK=assembleGithubRelease" >> "$GITHUB_ENV"
            echo "APK_PATH=android/app/build/outputs/apk/github/release/app-github-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: o APK sai com a chave de testes (pública) e o AAB sem assinatura. Cadastre a chave (docs/play-store.md)."
            echo "APK_TASK=assembleGithubDebug" >> "$GITHUB_ENV"
            echo "APK_PATH=android/app/build/outputs/apk/github/debug/app-github-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK (GitHub) e AAB (Play Store)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew "$APK_TASK" bundlePlayRelease --no-daemon

      - name: Apagar chave do app
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: plathunt-android
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # Pacote para enviar na Play Console (Produção, Teste interno...).
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_FILE != ''
        with:
          name: plathunt-play-store
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      - name: Publicar versão (Release)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp "$APK_PATH" Plathunt.apk
          if [ "$APK_TASK" = "assembleGithubRelease" ]; then
            NOTES="${NOTES:-Nova versão}

          🔐 Assinado com a chave própria do Plathunt. Se a instalação falhar por conflito de assinatura, desinstale uma vez a versão anterior (assinada com a chave de testes) e instale esta."
          fi
          gh release create "build-$VERSION_CODE" Plathunt.apk \
            --title "Plathunt $APP_VERSION (build $BUILD_NUMBER)" \
            --notes "${NOTES:-Nova versão}" \
            --target "$GITHUB_SHA"

      # Envio automático para a Play Console (faixa de teste interno, como
      # rascunho), só na main e se o segredo PLAY_SERVICE_ACCOUNT_JSON existir
      # (docs/play-store.md). O primeiro envio de um app novo é feito à mão na
      # Play Console. Uma falha aqui não derruba o build nem a Release do GitHub.
      - name: Preparar envio para a Play Store
        id: play
        if: github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_FILE != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sem PLAY_SERVICE_ACCOUNT_JSON: o AAB fica só no artefato plathunt-play-store (envie à mão na Play Console)."
          fi

      - name: Enviar para a Play Store (teste interno)
        if: steps.play.outputs.ok == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.plathunt.trophytracker
          releaseFiles: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          track: internal
          status: draft

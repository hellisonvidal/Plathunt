name: Android APK

# Gera o APK do PlayStation Trophy Mania (versão do GitHub) e o AAB da Play Store. Roda sozinho a cada mudança no app e
# também manualmente em Actions → Android APK → Run workflow.
# - Em qualquer branch: o APK fica em "Artifacts" (trophy-mania-android).
# - Na main: também publica uma Release "build-N" com o APK, que é o que o botão
#   "Verificar atualizações" do app consulta.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Vira o versionCode do Android e a versão mostrada em Configurações.
      BUILD_NUMBER: ${{ github.run_number }}
      VITE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix mobile

      - name: Testar e compilar o app
        run: |
          npm test --prefix mobile
          npm run build --prefix mobile

      - name: Sincronizar projeto Android
        run: npx cap sync android

      # Chave de envio da Play Store (segredos do repositório, ver docs/play-store.md).
      # Sem os segredos, o pacote da Play Store é compilado (para conferir) mas sai sem assinatura.
      - name: Preparar chave da Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::Sem ANDROID_KEYSTORE_BASE64: o AAB da Play Store sai sem assinatura."
          fi

      - name: Compilar APK (GitHub) e AAB (Play Store)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleGithubDebug bundlePlayRelease --no-daemon

      - name: Apagar chave da Play Store
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: trophy-mania-android
          path: android/app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error

      # Pacote para enviar na Play Console (Produção, Teste interno...).
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_FILE != ''
        with:
          name: trophy-mania-play-store
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      - name: Publicar versão (Release)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/github/debug/app-github-debug.apk PlayStation-Trophy-Mania.apk
          gh release create "build-$BUILD_NUMBER" PlayStation-Trophy-Mania.apk \
            --title "PlayStation Trophy Mania 1.2 (build $BUILD_NUMBER)" \
            --notes "${NOTES:-Nova versão}" \
            --target "$GITHUB_SHA"

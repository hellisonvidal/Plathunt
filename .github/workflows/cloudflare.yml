name: Servidor (Cloudflare)

# Publica o servidor dos recursos online (pasta cloudflare/) no Cloudflare
# Workers, com o banco D1. Roda sozinho quando o servidor muda na main e
# também em Actions → Servidor (Cloudflare) → Run workflow.
# Precisa dos segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID
# (passo a passo em docs/cloudflare.md). Na primeira vez, cria o banco e a
# chave das sessões sozinho.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir segredos
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cadastre CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (docs/cloudflare.md) para publicar o servidor."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Instalar e conferir o código
        if: steps.secrets.outputs.ok == 'true'
        run: |
          npm ci --no-audit --no-fund
          npx tsc

      - name: Banco D1 (criado na primeira vez) e migrações
        if: steps.secrets.outputs.ok == 'true'
        run: |
          find_db() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "plathunt") | .uuid'; }
          id=$(find_db)
          if [ -z "$id" ]; then
            # Leste dos EUA: a região do D1 mais perto do Brasil.
            npx wrangler d1 create plathunt --location enam
            id=$(find_db)
          fi
          test -n "$id"
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml
          npx wrangler d1 migrations apply plathunt --remote

      - name: Publicar o Worker
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler deploy

      - name: Chave das sessões (criada na primeira vez)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if ! npx wrangler secret list | grep -q SESSION_SECRET; then
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put SESSION_SECRET
          fi

      - name: Conferir se está no ar
        if: steps.secrets.outputs.ok == 'true'
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          url="https://plathunt-api.$sub.workers.dev"
          for i in 1 2 3 4 5 6; do curl -fsS "$url/v1/health" && break; sleep 10; done
          echo "Servidor no ar: $url" >> "$GITHUB_STEP_SUMMARY"
